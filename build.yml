name: Build & Release FLASHClips

on:
  push:
    tags: ["v*"]          # push a tag like v1.0.0 -> builds and publishes a Release
  workflow_dispatch:       # or run it manually from the Actions tab

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (always the newest yt-dlp)
        run: |
          python -m pip install --upgrade pip
          pip install llama-cpp-python --prefer-binary --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          pip install -r requirements.txt pyinstaller
          pip install -U "yt-dlp[default]" yt-dlp-ejs

      - name: Download FFmpeg (GPL build with libass for captions)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ffsrc
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Copy-Item (Get-ChildItem ffsrc -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName bin\ffmpeg.exe

      - name: Download Deno (JavaScript runtime needed by yt-dlp for YouTube)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath bin -Force

      - name: Build app with PyInstaller
        run: >
          pyinstaller run_flashclips.py --noconfirm --windowed --name FLASHClips
          --icon assets/icon.ico --add-data "assets;assets"
          --collect-data cv2 --collect-data faster_whisper --collect-binaries ctranslate2
          --collect-all yt_dlp --collect-all yt_dlp_ejs --collect-all llama_cpp
          --hidden-import psutil --hidden-import flashclips.gui.app --hidden-import flashclips.cli

      - name: Add FFmpeg + Deno, smoke test, zip
        shell: pwsh
        run: |
          Copy-Item -Recurse bin dist\FLASHClips\bin
          dist\FLASHClips\bin\deno.exe --version
          dist\FLASHClips\bin\ffmpeg.exe -hide_banner -filters | Select-String " ass "
          Compress-Archive -Path dist\FLASHClips -DestinationPath FLASHClips-Windows-portable.zip

      - name: Build installer (Inno Setup)
        continue-on-error: true
        shell: pwsh
        run: |
          $env:APP_VERSION = "${{ github.ref_name }}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FLASHClips-Windows-portable.zip
            Output/FLASHClips-Setup.exe
          generate_release_notes: true
          fail_on_unmatched_files: false

      - name: Upload build (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: FLASHClips-Windows
          path: FLASHClips-Windows-portable.zip
